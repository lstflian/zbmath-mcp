[project]
name = "zbmath-mcp"
version = "0.1.0"
description = "MCP server for zbMath Open REST API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "mcp[cli]>=2.3.0,<3",
]

[project.scripts]
zbmath-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.22.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
